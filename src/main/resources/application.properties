# Base API Path
api.base=/api/v1/auth_svs

# R2DBC Initialization
spring.r2dbc.initialization.mode=always

# Enable the application's conditional DB initializer (schema.sql + data.sql)
app.db.init=false

# OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.auth=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.security=DEBUG

# Password reset email (configure SMTP credentials through environment variables)
app.password-reset.code-lifetime=10m
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}